name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push origin v0.1.0`) and this builds the
# Windows desktop installer + the Android APK and publishes them to a GitHub Release.
# Public-repo CI minutes are free, and the public build logs double as a trust signal
# (the binaries are provably built from this source).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    name: Windows desktop (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Supabase creds for the build. Vite inlines VITE_* from .env, which CI doesn't
      # have otherwise — without this the companion's marker auto-detect submit fails
      # with "credentials missing". The anon key is public (RLS-protected), already
      # shipped in the public web bundle.
      - name: Write .env (Supabase)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          {
            echo "VITE_SUPABASE_URL=$SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          } > .env
      # Builds the web assets (beforeBuildCommand) + the Tauri bundles. Unsigned — see the
      # "Is it safe?" note in the README.
      - name: Build Tauri bundles
        run: npm run tauri build
      - name: Publish installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    name: Android APK (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      # gradle.properties pins a local Windows JDK path; drop it so CI uses the runner's JDK 17.
      - name: Use the runner JDK
        run: sed -i '/org\.gradle\.java\.home/d' android/gradle.properties
      # Recreate the signing config from repo secrets (never stored in git).
      # Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > butu-release.keystore
      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$STORE_PASSWORD"
          } > keystore.properties
      # android/app/build.gradle.kts reads SUPABASE_* from the repo-root .env into
      # BuildConfig; without it the TV app can't read cloud markers.
      - name: Write .env (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          } > .env
      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Publish APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
